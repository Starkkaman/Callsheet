<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daily Brief · Callsheet</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="callsheet-version" content="{{version}}">
<!-- Every URL in this app is relative: Home Assistant Ingress serves it under /api/hassio_ingress/<token>/.
     server.py fills in the app version (?v= and the meta): new asset URLs after every update. -->
<link rel="stylesheet" href="app.css?v={{version}}">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
<div class="app" id="app" data-look="bold" data-base="bold" data-mode="auto">

<header class="top">
  <div class="topbar">
    <span class="brand disp">Callsheet</span>
    <span class="hmeta" id="fresh" hidden><span class="dt" id="hdr-date"></span><span class="rf" id="fresh-t"></span></span>
    <span class="tag sample" id="sample-tag" hidden>Sample data</span>
    <span class="hnav">
      <button type="button" class="hbtn" id="refresh-btn" hidden><svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M13.2 3v3.4H9.8M2.8 13V9.6h3.4M12.8 6.2A5 5 0 0 0 3.5 6M3.2 9.8a5 5 0 0 0 9.3.2"/></svg><span class="bl">Refresh</span></button>
      <button type="button" class="hbtn" id="setup-btn"><svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 4h10M3 8h10M3 12h10M6 2.5v3M10 6.5v3M5 10.5v3"/></svg><span class="bl">Setup</span></button>
      <button type="button" class="hbtn" id="back-btn" hidden>Back to brief</button>
      <button type="button" class="hbtn lookbtn" id="look-btn" aria-expanded="false" aria-controls="look-panel"><svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8 2a6 6 0 1 0 0 12A6 6 0 0 0 8 2zM8 2v12"/></svg><span class="bl">Look</span></button>
    </span>
    <span class="err" id="refresh-err" role="alert"></span>
  </div>
  <div class="lookpanel" id="look-panel" role="region" aria-label="Look and mode" hidden>
    <div class="grp" role="group" aria-labelledby="lbl-look"><span class="label" id="lbl-look">Callsheet</span>
      <button type="button" class="chip lchip" data-set-look="bold" aria-pressed="true"><span class="app lsw" data-look="bold" data-base="bold" data-mode="auto" aria-hidden="true"><i></i><i></i></span>Bold</button>
      <button type="button" class="chip lchip" data-set-look="clean" aria-pressed="false"><span class="app lsw" data-look="clean" data-base="clean" data-mode="auto" aria-hidden="true"><i></i><i></i></span>Clean</button>
      <button type="button" class="chip lchip" data-set-look="easy" aria-pressed="false"><span class="app lsw" data-look="easy" data-base="easy" data-mode="auto" aria-hidden="true"><i></i><i></i></span>Easy read</button>
    </div>
    <div class="grp" role="group" aria-labelledby="lbl-jam"><span class="label" id="lbl-jam">Jam looks</span>
      <button type="button" class="chip lchip" data-set-look="depth" aria-pressed="false"><span class="app lsw" data-look="depth" data-base="clean" data-mode="auto" aria-hidden="true"><i></i><i></i></span>Depth</button>
      <button type="button" class="chip lchip" data-set-look="braun" aria-pressed="false"><span class="app lsw" data-look="braun" data-base="clean" data-mode="auto" aria-hidden="true"><i></i><i></i></span>Braun</button>
      <button type="button" class="chip lchip" data-set-look="nerv" aria-pressed="false"><span class="app lsw" data-look="nerv" data-base="bold" data-mode="auto" aria-hidden="true"><i></i><i></i></span>NERV</button>
      <button type="button" class="chip lchip" data-set-look="lcars" aria-pressed="false"><span class="app lsw" data-look="lcars" data-base="bold" data-mode="auto" aria-hidden="true"><i></i><i></i></span>LCARS</button>
      <button type="button" class="chip lchip" data-set-look="olympia" aria-pressed="false"><span class="app lsw" data-look="olympia" data-base="bold" data-mode="auto" aria-hidden="true"><i></i><i></i></span>Olympia</button>
      <button type="button" class="chip lchip" data-set-look="transit" aria-pressed="false"><span class="app lsw" data-look="transit" data-base="bold" data-mode="auto" aria-hidden="true"><i></i><i></i></span>Transit</button>
      <button type="button" class="chip lchip" data-set-look="grid" aria-pressed="false"><span class="app lsw" data-look="grid" data-base="bold" data-mode="auto" aria-hidden="true"><i></i><i></i></span>Grid</button>
      <button type="button" class="chip lchip" data-set-look="newwave" aria-pressed="false"><span class="app lsw" data-look="newwave" data-base="clean" data-mode="auto" aria-hidden="true"><i></i><i></i></span>New Wave</button>
      <button type="button" class="chip lchip" data-set-look="pulsar" aria-pressed="false"><span class="app lsw" data-look="pulsar" data-base="clean" data-mode="auto" aria-hidden="true"><i></i><i></i></span>Pulsar</button>
    </div>
    <div class="grp" role="group" aria-labelledby="lbl-mode"><span class="label" id="lbl-mode">Mode</span>
      <button type="button" class="chip" data-set-mode="auto" aria-pressed="true">Auto</button>
      <button type="button" class="chip" data-set-mode="light" aria-pressed="false">Light</button>
      <button type="button" class="chip" data-set-mode="dark" aria-pressed="false">Dark</button>
      <span class="note darknote" hidden>Always dark</span>
    </div>
    <div class="grp sungrp" id="sun-grp" role="group" aria-labelledby="lbl-sun" hidden><span class="label" id="lbl-sun">Auto follows</span>
      <button type="button" class="chip" data-set-auto="device" aria-pressed="true">Device</button>
      <button type="button" class="chip" data-set-auto="sunset" aria-pressed="false">Sunset</button>
      <span class="sunplace" id="sun-place" hidden><label>Latitude <input class="inp" id="sun-lat" type="number" step="any" min="-90" max="90" inputmode="decimal"></label><label>Longitude <input class="inp" id="sun-lon" type="number" step="any" min="-180" max="180" inputmode="decimal"></label></span>
      <span class="note" id="sun-note"></span>
    </div>
    <span class="err" id="look-err" role="alert"></span>
  </div>
</header>

<div class="banner update" id="update-note" role="status" hidden></div>

<main class="main" id="main">
  <p class="status" id="status" role="status">Loading…</p>
</main>

</div>
<!-- Icons (16x16 line glyphs), cloned by app.js: the HTML parser puts them in the SVG namespace. -->
<template id="icons">
<svg data-i="mail" class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 3.5h11a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1zM2 4.5l6 4.5 6-4.5"/></svg>
<svg data-i="slack" class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.3 2 4.7 14M11.3 2 9.7 14M2.5 5.7h11.5M2 10.3h11.5"/></svg>
<svg data-i="cal" class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h10a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM2 6.5h12M5.5 1.5v3M10.5 1.5v3"/></svg>
<svg data-i="signal" class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.3c3.3 0 6 2.3 6 5.1s-2.7 5.1-6 5.1c-.8 0-1.5-.1-2.2-.4L2.5 13.6l.9-3C2.5 9.7 2 8.6 2 7.4 2 4.6 4.7 2.3 8 2.3z"/></svg>
<svg data-i="note" class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 1.8h6.2L13 4.6v9.6H4zM10.2 1.8v2.8H13M6 7.2h5M6 9.6h5M6 12h3"/></svg>
<svg data-i="brief" class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h10M3 6.5h10M3 10h7M3 13.5h5"/></svg>
<svg data-i="areas" class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 2.5h4.5v4.5H2.5zM9 2.5h4.5v4.5H9zM2.5 9h4.5v4.5H2.5zM9 9h4.5v4.5H9z"/></svg>
<svg data-i="tasks" class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 2.5h11v11h-11zM5 8l2 2 4-4"/></svg>
<svg data-i="chat" class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 2.5h11a1 1 0 0 1 1 1V10a1 1 0 0 1-1 1H7.5L4 14v-3H2.5a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1zM5 6.7h6"/></svg>
<svg data-i="send" class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8h10M9 4l4 4-4 4"/></svg>
<svg data-i="drive" class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5.8 2h4.4l4.3 7.5-2.2 4H3.7l-2.2-4zM5.8 2l4.4 7.5h4.3M1.5 9.5 5.8 2M3.7 13.5l2.2-4h4.3"/></svg>
<svg data-i="back" class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg>
<svg data-i="close" class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
<svg data-i="copy" class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 5.5h7v8h-7zM3.5 10.5v-8h7"/></svg>
<svg data-i="lock"class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7V5a3 3 0 0 1 6 0v2"/><rect x="3" y="7" width="10" height="7.5" rx="1" fill="currentColor"/></svg>
</template>
<script src="app.js?v={{version}}"></script>
</body>
</html>
