name: "Callsheet"
version: "0.5.2"
slug: "callsheet"
description: "Your Daily Brief: schedule, replies due and project progress in one page. Read-only, drafts only, never sends."
url: "https://github.com/Starkkaman/callsheet"
arch:
  - amd64
  - aarch64
init: false
startup: application
# 0.5.1: phone notifications. The Supervisor gives SUPERVISOR_TOKEN for its Core API proxy; Callsheet only lists
# notify.mobile_app_* services and calls them (ha.py allowlist).
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: "mdi:clipboard-text-clock-outline"
panel_title: "Callsheet"
# Signal (0.5.1): signal-cli's keys for the linked device stay out of Home Assistant backups. A restored
# backup has no Signal link; link again in Setup.
backup_exclude:
  - "signal-cli"
  - "signal-cli/**"
# Optional: seed the local AI writer (an OpenAI-compatible server and model). Used only until the
# writer is changed in Callsheet's setup; empty values change nothing.
options:
  writer_local_url: ""
  writer_local_model: ""
schema:
  writer_local_url: "str?"
  writer_local_model: "str?"
