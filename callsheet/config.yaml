name: "Callsheet"
version: "0.3.4"
slug: "callsheet"
description: "Your Daily Brief: schedule, replies due and project progress in one page. Read-only, drafts only, never sends."
url: "https://github.com/Starkkaman/callsheet"
arch:
  - amd64
  - aarch64
init: false
startup: application
ingress: true
ingress_port: 8099
panel_icon: "mdi:clipboard-text-clock-outline"
panel_title: "Callsheet"
# Optional: seed the local AI writer (an OpenAI-compatible server and model). Used only until the
# writer is changed in Callsheet's setup; empty values change nothing.
options:
  writer_local_url: ""
  writer_local_model: ""
schema:
  writer_local_url: "str?"
  writer_local_model: "str?"
