name: "Callsheet"
version: "0.22.1"
slug: "callsheet"
description: "Your personal assistant: what needs you, what clashes and what is coming up, read from your messages by your own local model. Nothing is sent from here except an RSVP you press."
url: "https://github.com/Starkkaman/callsheet"
arch:
  - amd64
  - aarch64
init: false
startup: application
# 0.5.1: phone notifications. The Supervisor gives SUPERVISOR_TOKEN for its Core API proxy; Callsheet only lists
# notify.mobile_app_* services and calls them (ha.py allowlist).
homeassistant_api: true
# 0.6.0 Know me: Home Assistant's shared folders, read-only, so an Obsidian vault synced into /share or /media can be
# indexed (the folder is chosen in Setup). Callsheet never writes there.
map:
  - type: share
    read_only: true
  - type: media
    read_only: true
ingress: true
ingress_port: 8099
panel_icon: "mdi:clipboard-text-clock-outline"
panel_title: "Callsheet"
# 0.21.0 the phone voice assistant's read-only API (voiceapi.py, docs/voice-api.md): its own port, answered only while
# it is on in Setup › Connections › Voice assistant. Not exposed by default (null): pick the host port in Home Assistant
# (Callsheet › Configuration › Network). Your home network or a VPN; never expose it to the internet.
ports:
  8100/tcp: null
ports_description:
  8100/tcp: "Voice assistant API (read-only; your home network or a VPN; never expose it to the internet)"
# Signal (0.5.1): signal-cli's keys for the linked device stay out of Home Assistant backups. A restored
# backup has no Signal link; link again in Setup.
# 0.6.0: the local index (index.db) can be rebuilt from the sources, so it stays out of backups too.
backup_exclude:
  - "signal-cli"
  - "signal-cli/**"
  - "index.db*"
# Optional: seed the local AI writer (an OpenAI-compatible server and model). Used only until the
# writer is changed in Callsheet's setup; empty values change nothing.
options:
  writer_local_url: ""
  writer_local_model: ""
schema:
  writer_local_url: "str?"
  writer_local_model: "str?"
